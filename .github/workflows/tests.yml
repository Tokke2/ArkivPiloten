name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: >-
          python -c "import pathlib,subprocess,sys; p=subprocess.run([sys.executable,'-m','pytest','-q','--tb=short'],capture_output=True,text=True); output=(p.stdout or '')+(p.stderr or ''); print(output,end=''); pathlib.Path('pytest-output.log').write_text(output,encoding='utf-8'); sys.exit(p.returncode)"
      - name: Attach concise test failure details
        if: failure()
        run: >-
          python -c "from pathlib import Path; lines=Path('pytest-output.log').read_text(encoding='utf-8',errors='replace').splitlines()[-40:]; [print('::error::'+line.replace('%','%25').replace(':','%3A').replace(',','%2C')) for line in lines]"
