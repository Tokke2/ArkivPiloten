name: release

# Publicerar (eller uppdaterar) GitHub-releasen varje gång koden når main
# eller en versions-tagg skapas. Appens autouppdatering läser alltid den
# senaste releasen - därför måste releasen alltid spegla senaste koden.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package + SHA256SUMS
        run: python tools/build_release.py --out dist

      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json;print(json.load(open('dist/release.json'))['version'])")
          TAG="v$VERSION"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)

          {
            echo "Paket byggt från \`${GITHUB_SHA::12}\` på \`${GITHUB_REF_NAME}\`."
            echo
            echo "Autouppdateringen verifierar paketet mot \`SHA256SUMS.txt\` innan något installeras."
            echo
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              echo "### Ändringar sedan $PREV"
              echo
              git log --pretty='- %s (%h)' "$PREV..HEAD" | head -40
            fi
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uppdaterar befintlig release $TAG med senaste bygget."
            gh release upload "$TAG" dist/ArkivPiloten.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "Skapar release $TAG."
            gh release create "$TAG" dist/ArkivPiloten.zip dist/SHA256SUMS.txt \
              --title "ArkivPiloten $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
